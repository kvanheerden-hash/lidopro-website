<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LidoPro® | Effective Non-Addictive Pain Relief</title>
    <meta name="description" content="Physicians trust LidoPro® for safe and effective pain relief. Explore our Ointment and Patch solutions." />
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ['Inter', 'sans-serif'],
            },
            colors: {
              brand: {
                50: '#f0f9ff',
                100: '#e0f2fe',
                500: '#0ea5e9',
                600: '#0284c7',
                800: '#075985',
                900: '#0c4a6e',
              },
              accent: {
                500: '#14b8a6',
                600: '#0d9488',
              }
            },
            keyframes: {
              'blur-reveal': {
                '0%': { filter: 'blur(12px)', opacity: '0', transform: 'translateY(2rem)' },
                '100%': { filter: 'blur(0)', opacity: '1', transform: 'translateY(0)' },
              }
            },
            animation: {
              'blur-reveal': 'blur-reveal 1.2s cubic-bezier(0.22, 1, 0.36, 1) forwards',
            }
          },
        },
      }
    </script>
    <style>
      html { scroll-behavior: smooth; }
      .reveal-hidden { opacity: 0; }
    </style>
  </head>
  <body class="bg-slate-50 text-slate-800 antialiased selection:bg-brand-200 selection:text-brand-900">
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script> 
  </body>
</html>
