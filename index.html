<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LidoPro® | Effective Non-Addictive Pain Relief</title>
    <meta name="description" content="Physicians trust LidoPro® for safe and effective pain relief. Explore our Ointment and Patch solutions." />
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ['Inter', 'sans-serif'],
            },
            colors: {
              brand: {
                50: '#f0f9ff',
                100: '#e0f2fe',
                500: '#0ea5e9',
                600: '#0284c7',
                800: '#075985',
                900: '#0c4a6e',
              },
              accent: {
                500: '#14b8a6',
                600: '#0d9488',
              }
            },
            keyframes: {
              'blur-reveal': {
                '0%': { filter: 'blur(12px)', opacity: '0', transform: 'translateY(2rem)' },
                '100%': { filter: 'blur(0)', opacity: '1', transform: 'translateY(0)' },
              }
            },
            animation: {
              'blur-reveal': 'blur-reveal 1.2s cubic-bezier(0.22, 1, 0.36, 1) forwards',
            }
          },
        },
      }
    </script>
    <style>
      html { scroll-behavior: smooth; }
      .reveal-hidden { opacity: 0; }
    </style>
    <script type="importmap">
    {
      "imports": {
        "react": "https://esm.sh/react@19.2.3",
        "react-dom": "https://esm.sh/react-dom@19.2.3",
        "react/": "https://esm.sh/react@19.2.3/",
        "react-dom/": "https://esm.sh/react-dom@19.2.3/",
        "react-router-dom": "https://esm.sh/react-router-dom@7.1.3?external=react,react-dom",
        "framer-motion": "https://esm.sh/framer-motion@11.15.0?external=react,react-dom",
        "lucide-react": "https://esm.sh/lucide-react@0.469.0?external=react,react-dom",
        "clsx": "https://esm.sh/clsx@2.1.1",
        "tailwind-merge": "https://esm.sh/tailwind-merge@2.5.5",
        "class-variance-authority": "https://esm.sh/class-variance-authority@0.7.1",
        "@radix-ui/react-slot": "https://esm.sh/@radix-ui/react-slot@1.1.1?external=react,react-dom",
        "@/": "./"
      }
    }
    </script>
  </head>
  <body class="bg-slate-50 text-slate-800 antialiased selection:bg-brand-200 selection:text-brand-900">
    <div id="root"></div>
  </body>
</html>
